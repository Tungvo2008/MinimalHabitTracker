name: HabitTracker
options:
  bundleIdPrefix: vn.id.thanhtungvo
  deploymentTarget:
    iOS: "16.0"
  createSharedSchemes: true
targets:
  HabitTracker:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: HabitTracker
    settings:
      base:
        PRODUCT_NAME: "little steps"
        PRODUCT_BUNDLE_IDENTIFIER: vn.id.thanhtungvo.habittracker
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  HabitTracker:
    build:
      targets:
        HabitTracker: all
    run:
      config: Debug
    archive:
      config: Release
